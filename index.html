<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Exquisite Game Corpse</title>
        <style>
            :root {
                color-scheme: dark;
                font-family: system-ui, sans-serif;
                background: #171521;
                color: #f5f0ff;
            }

            * {
                box-sizing: border-box;
            }

            body {
                min-height: 100vh;
                margin: 0;
                padding: 0;
                display: grid;
                place-items: center;
                background:
                    radial-gradient(ellipse at top, #302348 0, transparent 55%),
                    #171521;
            }

            main {
                width: min(100%, 680px);
                padding: clamp(0.5rem, 3vw, 2rem);
                border: 1px solid #55466d;
                border-radius: 24px;
                background: #211c2ddd;
                box-shadow: 0 24px 80px #09070f88;
            }

            h1 {
                margin: 0.5rem 0 1rem;
                font-size: clamp(1.5rem, 7vw, 3rem);
                line-height: 1;
            }

            .intro {
                color: #c7bed2;
                line-height: 1.6;
            }

            .story {
                display: grid;
                gap: 0.85rem;
                margin: 1rem 0;
            }

            .card {
                display: flex;
                align-items: start;
                justify-content: space-between;
                gap: 1rem;
                padding: 1rem 1.2rem;
                border: 1px solid #443852;
                border-radius: 14px;
                background: #2a2436;
            }

            .card-content {
                min-width: 0;
            }

            .card h2 {
                margin: 0 0 0.35rem;
                color: #c2a8ff;
                font-size: 0.75rem;
                letter-spacing: 0.1em;
                text-transform: uppercase;
            }

            .card p {
                margin: 0;
                line-height: 1.5;
            }

            .seed-row {
                display: flex;
                flex-wrap: wrap;
                align-items: center;
                gap: 0.5rem;
                color: #c7bed2;
                font-size: 0.9rem;
            }

            code {
                padding: 0.3rem 0.55rem;
                border-radius: 6px;
                background: #14111b;
                color: #e6d9ff;
                overflow-wrap: anywhere;
            }

            .actions {
                display: flex;
                flex-wrap: wrap;
                gap: 0.75rem;
                margin-top: 1rem;
            }

            button {
                border: 0;
                border-radius: 10px;
                padding: 0.7rem 0.9rem;
                font: inherit;
                font-weight: 700;
                cursor: pointer;
            }

            button:focus-visible {
                outline: 3px solid #fff;
                outline-offset: 3px;
            }

            .pin-button {
                flex: 0 0 auto;
                color: #f5f0ff;
                background: #443852;
            }

            .pin-button[aria-pressed="true"] {
                color: #1c1429;
                background: #c2a8ff;
            }

            #generate {
                color: #1c1429;
                background: #c2a8ff;
            }

            #copy {
                color: #f5f0ff;
                background: #443852;
            }

            #status {
                min-height: 1.4em;
                margin-top: 0.8rem;
                color: #c7bed2;
                font-size: 0.85rem;
            }

            @media (max-width: 420px) {
                .card {
                    align-items: flex-start;
                    padding: 0.9rem;
                }
            }
        </style>
    </head>
    <body>
        <main>
            <h1>Exquisite Game Corpse</h1>
            <p class="intro">Game ideas shuffle.</p>

            <div class="actions">
                <button id="generate" type="button">Shuffle the story</button>
                <button id="copy" type="button">Copy share link</button>
                <div id="status" role="status"></div>
                <div class="seed-row">
                    <span>Story seed:</span>
                    <code id="seed"></code>
                </div>
            </div>

            <section class="story" id="story" aria-live="polite"></section>
        </main>

        <script>
            const pieces = {
                Theme: [
                    "a city built inside a sleeping giant",
                    "the last summer before the moon falls",
                    "a kingdom where memories are currency",
                    "an ocean that has forgotten how to be wet",
                    "a cheerful apocalypse with excellent customer service",
                    "a desert where the sand remembers every footprint",
                    "a traveling circus that appears only during eclipses",
                    "a forest growing through the floors of an abandoned hotel",
                    "a world where everyone has a double living underground",
                    "a mountain that moves a little closer every night",
                    "a space station built around a very stubborn star",
                    "a town where dreams are broadcast on the radio",
                    "a museum displaying objects from the future",
                    "a winter that has lasted for one hundred years",
                    "a forest where fairies discuss philosophy",
                    "a floating archipelago connected by enormous ladders",
                ],

                GameStyle: [
                  "platformer",
                  "third-person adventure",
                  "top-down action",
                  "isometric exploration",
                  "first-person puzzle",
                  "side-scrolling beat 'em up",
                  "turn-based tactical RPG",
                  "stealth sandbox",
                  "survival crafting",
                  "narrative point-and-click",
                  "roguelike dungeon crawler",
                  "open-world racing",
                  "tower defense",
                  "rhythm action",
                ],

                CharacterAttribute: [
                    "retired",
                    "tiny",
                    "ghostly",
                    "overconfident",
                    "mysteriously polite",
                    "forgetful",
                    "moonlit",
                    "overgrown",
                    "undercover",
                    "time-lost",
                    "unusually fashionable",
                    "half-invisible",
                    "newly hatched",
                    "deeply suspicious",
                    "made of porcelain",
                ],

                CharacterSubject: [
                    "dragon",
                    "knight",
                    "courier",
                    "botanist",
                    "clockwork detective",
                    "raccoon",
                    "librarian",
                    "mushroom",
                    "pirate",
                    "astronaut",
                    "fortune teller",
                    "giant",
                    "puppet",
                    "frog",
                    "mail carrier",
                ],

                CharacterJob: [
                    "delivers letters to people not born yet",
                    "runs a suspicious bakery",
                    "repairs broken promises",
                    "guards an empty throne",
                    "collects lost shadows",
                    "keeps the town's shadows organized",
                    "finds homes for misplaced monsters",
                    "teaches etiquette to sea creatures",
                    "delivers soup to haunted houses",
                    "tracks down runaway weather",
                    "translates messages from ancient statues",
                    "polishes the moon every Thursday",
                    "investigates unusual holes in the ground",
                    "organizes the annual monster parade",
                    "keeps an eye on the world's last candle",
                ],

                Situation: [
                    "the annual festival has been accidentally sent into orbit",
                    "every door now opens into the same suspicious bakery",
                    "the royal map is changing faster than anyone can read it",
                    "a strange signal is coming from beneath the town square",
                    "all the clocks have started counting down from different numbers",
                    "the town's statue has started giving very specific advice",
                    "a storm has trapped everyone inside a giant greenhouse",
                    "the local river is flowing uphill and telling jokes",
                    "a mysterious elevator has appeared in the middle of a field",
                    "all the birds have agreed to keep one enormous secret",
                    "the castle has misplaced its front door",
                    "someone has stolen every reflection in the village",
                    "a parade of tiny ships is sailing across the rooftops",
                    "the sun has begun setting in the wrong direction",
                    "a library book has escaped and is changing the town",
                ],

                Goal: [
                    "recover a missing ingredient before the midnight feast",
                    "convince three rival factions to share one very small boat",
                    "find out who keeps replacing the mountains",
                    "deliver a fragile package without learning what's inside",
                    "save the town's most unpopular holiday",
                    "return a runaway island to its proper place",
                    "win a cooking contest judged by three dragons",
                    "find the key hidden somewhere in yesterday",
                    "get a stubborn lighthouse to turn back on",
                    "reunite a shadow with the person who lost it",
                    "escort a very nervous giant across the border",
                    "stop the town's fountain from granting wishes",
                    "solve a mystery before the next full moon",
                    "teach a mysterious creature how to knock",
                    "persuade the clouds to give the mountains a day off",
                ],

                Power: [
                    "can rewind one object by exactly ten seconds",
                    "can speak with anything that has been dropped",
                    "can turn a promise into a physical tool",
                    "can borrow someone else's shadow for a minute",
                    "can make one lie become true—but only briefly",
                    "make any small object sing one useful clue",
                    "swap places with a nearby reflection",
                    "grow a temporary door in any wall",
                    "freeze a sound in place for one minute",
                    "make footprints appear wherever you point",
                    "ask one question of a recently broken object",
                    "change the color of anything you can name",
                    "create a short bridge out of a spoken rhyme",
                    "shrink one object until it fits in your pocket",
                    "borrow the speed of anything moving nearby",
                ],

                Boss: [
                    "a velvet-cloaked moon accountant",
                    "the giant's extremely punctual dentist",
                    "a disgraced wizard living in a vending machine",
                    "the Queen of Unfinished Business",
                    "a sentient storm wearing a tiny crown",
                    "a lighthouse keeper who collects bottled storms",
                    "the Mayor of an invisible village",
                    "a retired volcano with a grudge",
                    "a three-headed librarian guarding one book",
                    "a porcelain empress who fears fingerprints",
                    "the last pirate captain on a landlocked lake",
                    "a magician who has misplaced their own reflection",
                    "a sleepy giant who thinks the heroes are furniture",
                    "a clockwork judge who sentences people to dance",
                    "a mysterious tailor who sews secret doors into coats",
                ],

                Minions: [
                    "apprentice scarecrows with excellent posture",
                    "a swarm of tiny unpaid interns",
                    "three nervous knights sharing one horse",
                    "mischievous puddles in little helmets",
                    "overly loyal robots that keep misreading orders",
                    "polite skeletons carrying tiny briefcases",
                    "moss-covered guards who speak only in riddles",
                    "a band of raccoons in borrowed uniforms",
                    "nervous bats delivering badly written warnings",
                    "wind-up toys marching slightly out of step",
                    "small dragons who sneeze whenever they lie",
                    "enchanted umbrellas that refuse to open",
                    "a squad of sleepy ghosts in matching scarves",
                    "beetles pushing a very important button",
                    "paper birds folded from old maps",
                ],
            };

            const params = new URLSearchParams(window.location.search);
            let currentSeed = params.get("seed") || newSeed();
            const pinned = new Map();

            // Read pinned category indexes from the URL.
            for (const [category, options] of Object.entries(pieces)) {
                const key = category.toLowerCase();
                const value = params.get(key);

                if (value !== null) {
                    const index = Number(value);
                    if (
                        Number.isInteger(index) &&
                        index >= 0 &&
                        index < options.length
                    ) {
                        pinned.set(category, index);
                    }
                }
            }

            function makeRandom(seed) {
                let state = 2166136261;
                for (const char of seed) {
                    state ^= char.charCodeAt(0);
                    state = Math.imul(state, 16777619);
                }

                return function random() {
                    state += 0x6d2b79f5;
                    let value = state;
                    value = Math.imul(value ^ (value >>> 15), value | 1);
                    value ^=
                        value + Math.imul(value ^ (value >>> 7), value | 61);
                    return ((value ^ (value >>> 14)) >>> 0) / 4294967296;
                };
            }

            function newSeed() {
                if (crypto.randomUUID) return crypto.randomUUID();
                return (
                    Math.random().toString(36).slice(2) +
                    Date.now().toString(36)
                );
            }

            function updateUrl() {
                const url = new URL(window.location.href);
                url.search = "";
                url.searchParams.set("seed", currentSeed);

                for (const [category, index] of pinned) {
                    url.searchParams.set(category.toLowerCase(), String(index));
                }

                history.replaceState(null, "", url);
            }

            function render() {
                const random = makeRandom(currentSeed);
                const story = document.querySelector("#story");
                story.replaceChildren();

                for (const [category, options] of Object.entries(pieces)) {
                    const isPinned = pinned.has(category);
                    const nextRandomIndex = Math.floor(
                        random() * options.length,
                    );
                    const index = isPinned
                        ? pinned.get(category)
                        : nextRandomIndex;

                    const choice = options[index];
                    const card = document.createElement("article");
                    card.className = "card";

                    const heading = document.createElement("h2");
                    heading.textContent = category;

                    const text = document.createElement("p");
                    text.textContent = choice;

                    const content = document.createElement("div");
                    content.className = "card-content";
                    content.append(heading, text);

                    const pinButton = document.createElement("button");
                    pinButton.className = "pin-button";
                    pinButton.type = "button";
                    pinButton.textContent = isPinned ? "Pinned" : "Pin";
                    pinButton.setAttribute("aria-pressed", String(isPinned));
                    pinButton.setAttribute(
                        "aria-label",
                        `${isPinned ? "Unpin" : "Pin"} ${category}`,
                    );

                    pinButton.addEventListener("click", () => {
                        if (pinned.has(category)) {
                            pinned.delete(category);
                        } else {
                            pinned.set(category, index);
                        }

                        updateUrl();
                        render();
                    });

                    card.append(content, pinButton);
                    story.append(card);
                }

                document.querySelector("#seed").textContent = currentSeed;
                document.querySelector("#status").textContent = "";
                updateUrl();
            }

            const startingSeed =
                new URLSearchParams(window.location.search).get("seed") ||
                newSeed();

            render();

            document
                .querySelector("#generate")
                .addEventListener("click", () => {
                    currentSeed = newSeed();
                    render();
                });

            document
                .querySelector("#copy")
                .addEventListener("click", async () => {
                    const status = document.querySelector("#status");
                    try {
                        await navigator.clipboard.writeText(
                            window.location.href,
                        );
                        status.textContent = "Share link copied.";
                    } catch {
                        status.textContent =
                            "Copy the URL from your browser’s address bar.";
                    }
                });
        </script>
    </body>
</html>
