<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Exquisite Game Corpse</title>
        <style>
            :root {
                color-scheme: dark;
                font-family: system-ui, sans-serif;
                background: #171521;
                color: #f5f0ff;
            }

            * {
                box-sizing: border-box;
            }

            body {
                min-height: 100vh;
                margin: 0;
                padding: 0;
                display: grid;
                place-items: center;
                background:
                    radial-gradient(ellipse at top, #302348 0, transparent 55%),
                    #171521;
            }

            main {
                width: min(100%, 680px);
                padding: clamp(0.5rem, 3vw, 2rem);
                border: 1px solid #55466d;
                border-radius: 24px;
                background: #211c2ddd;
                box-shadow: 0 24px 80px #09070f88;
            }

            h1 {
                margin: 0.5rem 0 1rem;
                font-size: clamp(1.5rem, 7vw, 3rem);
                line-height: 1;
            }

            .intro {
                color: #c7bed2;
                line-height: 1.6;
            }

            .story {
                display: grid;
                gap: 0.85rem;
                margin: 1rem 0;
            }

            .card {
                display: flex;
                align-items: start;
                justify-content: space-between;
                gap: 1rem;
                padding: 1rem 1.2rem;
                border: 1px solid #443852;
                border-radius: 14px;
                background: #2a2436;
            }

            .card-content {
                min-width: 0;
            }

            .card h2 {
                margin: 0 0 0.35rem;
                color: #c2a8ff;
                font-size: 0.75rem;
                letter-spacing: 0.1em;
                text-transform: uppercase;
            }

            .card p {
                margin: 0;
                line-height: 1.5;
            }

            .seed-row {
                display: flex;
                flex-wrap: wrap;
                align-items: center;
                gap: 0.5rem;
                color: #c7bed2;
                font-size: 0.9rem;
            }

            code {
                padding: 0.3rem 0.55rem;
                border-radius: 6px;
                background: #14111b;
                color: #e6d9ff;
                overflow-wrap: anywhere;
            }

            .actions {
                display: flex;
                flex-wrap: wrap;
                gap: 0.75rem;
                margin-top: 1rem;
            }

            button {
                border: 0;
                border-radius: 10px;
                padding: 0.7rem 0.9rem;
                font: inherit;
                font-weight: 700;
                cursor: pointer;
            }

            button:focus-visible {
                outline: 3px solid #fff;
                outline-offset: 3px;
            }

            .pin-button {
                flex: 0 0 auto;
                color: #f5f0ff;
                background: #443852;
            }

            .pin-button[aria-pressed="true"] {
                color: #1c1429;
                background: #c2a8ff;
            }

            #generate {
                color: #1c1429;
                background: #c2a8ff;
            }

            #copy {
                color: #f5f0ff;
                background: #443852;
            }

            #status {
                min-height: 1.4em;
                margin-top: 0.8rem;
                color: #c7bed2;
                font-size: 0.85rem;
            }

            @media (max-width: 420px) {
                .card {
                    align-items: flex-start;
                    padding: 0.9rem;
                }
            }
        </style>
    </head>
    <body>
        <main>
            <h1>Exquisite Game Corpse</h1>
            <p class="intro">Game ideas shuffle.</p>

            <div class="actions">
                <button id="generate" type="button">Shuffle the story</button>
                <button id="copy" type="button">Copy share link</button>
                <div id="status" role="status"></div>
                <div class="seed-row">
                    <span>Story seed:</span>
                    <code id="seed"></code>
                </div>
            </div>

            <section class="story" id="story" aria-live="polite"></section>
        </main>

            const params = new URLSearchParams(window.location.search);
            let currentSeed = params.get("seed") || newSeed();
            const pinned = new Map();

            // Read pinned category indexes from the URL.
            for (const [category, options] of Object.entries(pieces)) {
                const key = category.toLowerCase();
                const value = params.get(key);

                if (value !== null) {
                    const index = Number(value);
                    if (
                        Number.isInteger(index) &&
                        index >= 0 &&
                        index < options.length
                    ) {
                        pinned.set(category, index);
                    }
                }
            }

            function makeRandom(seed) {
                let state = 2166136261;
                for (const char of seed) {
                    state ^= char.charCodeAt(0);
                    state = Math.imul(state, 16777619);
                }

                return function random() {
                    state += 0x6d2b79f5;
                    let value = state;
                    value = Math.imul(value ^ (value >>> 15), value | 1);
                    value ^=
                        value + Math.imul(value ^ (value >>> 7), value | 61);
                    return ((value ^ (value >>> 14)) >>> 0) / 4294967296;
                };
            }

            function newSeed() {
                if (crypto.randomUUID) return crypto.randomUUID();
                return (
                    Math.random().toString(36).slice(2) +
                    Date.now().toString(36)
                );
            }

            function updateUrl() {
                const url = new URL(window.location.href);
                url.search = "";
                url.searchParams.set("seed", currentSeed);

                for (const [category, index] of pinned) {
                    url.searchParams.set(category.toLowerCase(), String(index));
                }

                history.replaceState(null, "", url);
            }

            function camelCaseToHeading(text) {
                return text
                    .replace(/([a-z0-9])([A-Z])/g, "$1 $2")
                    .replace(/^./, (char) => char.toUpperCase());
            }

            function render() {
                const random = makeRandom(currentSeed);
                const story = document.querySelector("#story");
                story.replaceChildren();

                for (const [category, options] of Object.entries(pieces)) {
                    const isPinned = pinned.has(category);
                    const nextRandomIndex = Math.floor(
                        random() * options.length,
                    );
                    const index = isPinned
                        ? pinned.get(category)
                        : nextRandomIndex;

                    const choice = options[index];
                    const card = document.createElement("article");
                    card.className = "card";

                    const heading = document.createElement("h2");
                    heading.textContent = camelCaseToHeading(category);

                    const text = document.createElement("p");
                    text.textContent = choice;

                    const content = document.createElement("div");
                    content.className = "card-content";
                    content.append(heading, text);

                    const pinButton = document.createElement("button");
                    pinButton.className = "pin-button";
                    pinButton.type = "button";
                    pinButton.textContent = isPinned ? "Pinned" : "Pin";
                    pinButton.setAttribute("aria-pressed", String(isPinned));
                    pinButton.setAttribute(
                        "aria-label",
                        `${isPinned ? "Unpin" : "Pin"} ${category}`,
                    );

                    pinButton.addEventListener("click", () => {
                        if (pinned.has(category)) {
                            pinned.delete(category);
                        } else {
                            pinned.set(category, index);
                        }

                        updateUrl();
                        render();
                    });

                    card.append(content, pinButton);
                    story.append(card);
                }

                document.querySelector("#seed").textContent = currentSeed;
                document.querySelector("#status").textContent = "";
                updateUrl();
            }

            const startingSeed =
                new URLSearchParams(window.location.search).get("seed") ||
                newSeed();

            render();

            document
                .querySelector("#generate")
                .addEventListener("click", () => {
                    currentSeed = newSeed();
                    render();
                });

            document
                .querySelector("#copy")
                .addEventListener("click", async () => {
                    const status = document.querySelector("#status");
                    try {
                        await navigator.clipboard.writeText(
                            window.location.href,
                        );
                        status.textContent = "Share link copied.";
                    } catch {
                        status.textContent =
                            "Copy the URL from your browser’s address bar.";
                    }
                });
        </script>
    </body>
</html>
